<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weel — How will you deliver?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cg transform='rotate(-38 13 13)'%3E%3Crect x='5.5' y='8.5' width='15' height='9' rx='4.5' fill='%2301c3a0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/weel.css">
</head>
<body data-init="ph2">
<main class="wizard-shell">
  <div class="stepper">
    <div class="label"><b>How you’ll deliver</b><span>Step 2 of 3</span></div>
    <div class="bar"><i style="width:66%"></i></div>
  </div>
  <div class="wizard-head">
    <h1>How will you deliver?</h1>
    <p>Pick what fits today — you can mix and change this anytime.</p>
  </div>

  <div class="tile-group" role="radiogroup" aria-label="Delivery model">
    <label class="tile">
      <input type="radio" name="model" value="own">
      <span><b>My own drivers</b><span>Your staff delivers. Weel adds routing, live tracking, and signature-grade proof of delivery.</span></span>
    </label>
    <label class="tile">
      <input type="radio" name="model" value="partner">
      <span><b>A courier company I already work with</b><span>Invite them to Weel — they keep delivering for you, now with compliant tracking. They get their own workspace.</span></span>
    </label>
    <label class="tile">
      <input type="radio" name="model" value="network">
      <span><b>The Weel courier network</b><span>Verified pharmacy couriers in your area, with cold-chain and controlled-substance capability tiers.</span></span>
    </label>
    <label class="tile">
      <input type="radio" name="model" value="mix">
      <span><b>A mix — my drivers plus network overflow</b><span>Your team handles the base load; the network absorbs peaks, evenings, and weekends.</span></span>
    </label>
  </div>

  <div class="wizard-actions">
    <a class="btn btn-ghost" href="/pharmacy/step-1.html">Back</a>
    <button class="btn btn-primary" id="next">Continue</button>
  </div>
</main>
<script src="/js/flow.js"></script>
</body>
</html>
