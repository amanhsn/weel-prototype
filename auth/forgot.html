<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weel — Reset your password</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cg transform='rotate(-38 13 13)'%3E%3Crect x='5.5' y='8.5' width='15' height='9' rx='4.5' fill='%2301c3a0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/weel.css">
<style>
  .shell { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .lock-ic { width: 64px; height: 64px; border-radius: 16px; background: var(--primary-subtle); color: var(--color-brand-700); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
</style>
</head>
<body data-init="forgot">
<main class="shell">
  <div class="card card-pad" style="max-width:440px;width:100%">
    <div class="lock-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <div id="form-zone">
      <h1 class="center" style="font-size:24px;font-weight:700" data-i18n="forgotHead">Reset your password</h1>
      <p class="center muted small mt-1 mb-3" data-i18n="forgotSub">Enter your work email and we’ll send a reset link.</p>
      <div class="field">
        <label for="email" data-i18n="emailLabel">Work email</label>
        <input class="input" id="email" type="email" data-i18n-ph="emailPh" placeholder="you@yourpharmacy.ca">
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="send" data-i18n="sendReset">Send reset link</button>
    </div>
    <div id="sent-zone" hidden>
      <h1 class="center" style="font-size:24px;font-weight:700" data-i18n="verifyHead">Check your inbox</h1>
      <p class="center muted small mt-2" data-i18n="resetSent">If an account exists for that email, a reset link is on its way.</p>
    </div>
  </div>
  <p class="mt-3"><a class="small" href="/index.html" data-i18n="backToLogin">Back to log in</a></p>
</main>
<script src="/js/flow.js"></script>
</body>
</html>
