<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weel — Verify your email</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cg transform='rotate(-38 13 13)'%3E%3Crect x='5.5' y='8.5' width='15' height='9' rx='4.5' fill='%2301c3a0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/weel.css">
<style>
  .shell { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .code { display: flex; gap: 10px; justify-content: center; margin: 26px 0; }
  .code input { width: 52px; height: 60px; text-align: center; font-size: 24px; font-family: var(--font-mono); font-weight: 600; border: 1px solid var(--input); border-radius: var(--radius); background: var(--card); text-transform: uppercase; }
  .code input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-subtle); outline: none; }
  .mail-ic { width: 64px; height: 64px; border-radius: 16px; background: var(--primary-subtle); color: var(--color-brand-700); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
</style>
</head>
<body data-init="verify">
<main class="shell">
  <div class="card card-pad" style="max-width:440px;width:100%">
    <div class="mail-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div>
    <h1 class="center" style="font-size:24px;font-weight:700" data-i18n="verifyHead">Check your inbox</h1>
    <p class="center muted small mt-1"><span data-i18n="verifySub">We sent a 6-character code to</span> <b id="email-echo">you@yourpharmacy.ca</b></p>
    <div class="code">
      <input maxlength="1" aria-label="Character 1"><input maxlength="1" aria-label="Character 2"><input maxlength="1" aria-label="Character 3"><input maxlength="1" aria-label="Character 4"><input maxlength="1" aria-label="Character 5"><input maxlength="1" aria-label="Character 6">
    </div>
    <button class="btn btn-primary btn-lg btn-block" id="verify-btn" disabled data-i18n="verifyBtn">Verify email</button>
    <p class="center mt-2 small"><a href="#" id="resend" data-i18n="resend">Resend code</a></p>
    <p class="center small muted mt-2" data-i18n="demoHint">Prototype: any email works. Codes and passwords aren’t checked.</p>
  </div>
  <p class="mt-3"><a class="small" href="/index.html" data-i18n="backToLogin">Back to log in</a></p>
</main>
<script src="/js/flow.js"></script>
</body>
</html>
